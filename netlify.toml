# Netlify build & deploy configuration for PaWa Data Solutions
# Static Vite + React SPA — no backend. Forms handled by Netlify Forms.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No SPA catch-all, on purpose. Every route in sitemap.xml is prerendered to its
# own static index.html by scripts/prerender.mjs, so unmatched URLs fall through
# to Netlify's auto-served dist/404.html (a real HTTP 404) rather than the home
# page at HTTP 200. The prerender step is REQUIRED — if it fails, the build fails
# and the last good deploy stays live, so dropping the fallback can never leave a
# real route unserved. Netlify Forms still intercepts POSTs to "/" before any of
# this runs.

# No casing redirects here, deliberately.
#
# Netlify lowercases every deployed path and serves directories with a trailing
# slash, so the prerendered dist/DataIntegration/index.html is served at
# /dataintegration/ and Netlify itself 301s /DataIntegration to it. An earlier
# attempt added /dataintegration -> /DataIntegration rules, which pointed the
# opposite way and produced an infinite redirect loop on all ten service and
# legal pages. `netlify dev` does not reproduce it: locally the matcher is
# case-sensitive and macOS's filesystem is not, which is the reverse of
# production on both counts.
#
# createPageUrl(), sitemap.xml and the canonical tags now all emit the lowercase
# trailing-slash form, so links, sitemap and canonicals agree with what the CDN
# actually serves and no rule is needed.

# Redirects are GENERATED into public/_redirects by scripts/gen-redirects.mjs
# from src/lib/pages.js. They are not kept here, because a hand-maintained list
# beside a generated one is exactly how the URL casing drifted and took every
# service page down with a redirect loop.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The allowlist is the site's ACTUAL external resource graph, nothing more.
    #   plausible.io  analytics script (script-src) + its event beacon (connect-src)
    # Everything else is same-origin. Netlify Forms POSTs to "/", hence
    # form-action 'self'. Adding any third-party script, font, image host or API
    # endpoint means adding it HERE too, or it fails closed in production.
    #
    # No 'unsafe-inline' on script-src: the Plausible snippet in index.html is a
    # plain external <script defer data-domain>, with no inline stub to allow.
    # The prerendered JSON-LD blocks are type="application/ld+json", which is not
    # executable and so is not governed by script-src.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://plausible.io; font-src 'self'; connect-src 'self' https://plausible.io; form-action 'self'"

# Long-cache fingerprinted build assets (filenames change on every build).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
